async function sbDownloadFresh(){
  // FIX CACHE: scarica sempre la versione NUOVA, mai quella vecchia in memoria di Supabase
  // Aggiunge ?t=ora così Supabase non può dare quella vecchia agli amici
  try{
    var url = SB_URL + '/storage/v1/object/public/Fmp-foto/stagione.json?t=' + Date.now() + '_' + Math.floor(Math.random()*999999);
    var r = await fetch(url, {cache:'no-store', headers:{'Cache-Control':'no-cache, no-store'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var txt = await r.text();
    return {txt:txt};
  }catch(e){
    // Se il fetch pubblico non va, prova il vecchio metodo
    var dl = await sbClient.storage.from('Fmp-foto').download('stagione.json');
    if(dl.error) return {error:dl.error};
    var txt2 = await dl.data.text();
    return {txt:txt2};
  }
}

  }

    var pd=null; for(var j=0;j<data[fotoCamp].length;j++){ if(data[fotoCamp][j].n===r.pilot||data[fotoCamp][j].c===r.pilot||data[fotoCamp][j].id===r.pilot) pd=data[fotoCamp][j]; }

function realPenKey(k){if(pen[k])return k;var parts=k.split('_');var gp=parts[parts.length-1];var pil=findPilotById(parts.slice(0,parts.length-1).join('_'));if(pil&&pil.c){var oldk=pil.c+'_'+gp;if(pen[oldk])return oldk}return k}
function otherPenKey(k){var parts=k.split('_');var gp=parts[parts.length-1];var pil=findPilotById(parts.slice(0,parts.length-1).join('_'));if(!pil)return '';if(k==pil.id+'_'+gp)return pil.c+'_'+gp;if(k==pil.c+'_'+gp)return pil.id+'_'+gp;return ''}
function selPen(k){if(!adminOK){alert('Solo gli admin possono modificare le penalita. Entra in ADMIN con la password.');return}sel=realPenKey(k);render()}

function clearPen(k){if(!adminOK){alert('Solo gli admin possono cancellare. Entra in ADMIN.');return}var rk=realPenKey(k);var ok2=otherPenKey(rk);delete pen[rk];if(ok2)delete pen[ok2];delete pen[k];sel='';render();toast()}
